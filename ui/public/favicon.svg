<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient: 85% purple, then green, then black -->
    <linearGradient id="openjeeves-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="25%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="75%" stop-color="#22c55e"/>
      <stop offset="90%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <!-- Glow filter for the prompt -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hexagon background -->
  <path d="M60 10 L95 30 L95 70 L60 90 L25 70 L25 30 Z" 
        fill="url(#openjeeves-gradient)"/>
  
  <!-- Hexagon border -->
  <path d="M60 10 L95 30 L95 70 L60 90 L25 70 L25 30 Z" 
        fill="none" 
        stroke="#a78bfa" 
        stroke-width="1.5"
        opacity="0.4"/>
  
  <!-- Terminal prompt: $ with block cursor -->
  <text x="60" y="62" 
        font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace"
        font-size="28"
        font-weight="bold"
        fill="#4ade80"
        text-anchor="middle"
        dominant-baseline="middle"
        filter="url(#glow)">
    $<tspan dx="6" fill="#22c55e">&#9608;</tspan>
  </text>
</svg>